# QC Tools and Assemblers Configuration
# This file defines which quality control tools and assemblers are available and their parameters
# Tools can be enabled/disabled and configured without modifying the pipeline code

qc_tools:
  # Baseline tool - no filtering (always enabled)
  copyfastq:
    enabled: true
    module: "COPYFASTQ"
    module_path: "../../../modules/local/copyfastq/main"
    output_channel: "fastq"
    parameters:
      - name: "baseline"
        values: [0]
        description: "No filtering - baseline comparison"

  # Chopper - quality filtering for nanopore data
  chopper:
    enabled: true
    module: "CHOPPER"
    module_path: "../../../modules/nf-core/chopper/main"
    output_channel: "fastq"
    parameters:
      - name: "quality_scores"
        values: [13, 15]
        description: "Filter by minimum average Phred quality score"

  # PRINSEQ++ - multi-threaded quality control
  prinseqplusplus:
    enabled: true
    module: "PRINSEQPLUSPLUS"
    module_path: "../../../modules/nf-core/prinseqplusplus/main"
    output_channel: "good_reads"
    parameters:
      - name: "quality_scores"
        values: [13, 15]
        description: "Filter by quality metrics"

  # Example: Filtlong - length-based filtering (disabled by default)
  filtlong:
    enabled: false
    module: "FILTLONG"
    module_path: "../../../modules/nf-core/filtlong/main"
    output_channel: "reads"
    parameters:
      - name: "min_length"
        values: [1000, 2000]
        description: "Filter by minimum read length"

  # Example: NanoFilt - another quality filter (disabled by default)
  nanofilt:
    enabled: false
    module: "NANOFILT"
    module_path: "../../../modules/nf-core/nanofilt/main"
    output_channel: "fastq"
    parameters:
      - name: "quality_scores"
        values: [13, 15]
        description: "Filter by quality score"

  # Example: Custom tool with direct values
  custom_tool:
    enabled: false
    module: "CUSTOM_TOOL"
    module_path: "../../../modules/local/custom_tool/main"
    output_channel: "fastq"
    parameters:
      - name: "custom_param"
        values: [10, 20, 30]
        description: "Custom parameter values"

# Assemblers Configuration
# This section defines which assemblers are available and their parameters
assemblers:
  # Flye - long-read assembler (enabled by default)
  flye:
    enabled: true
    module: "FLYE"
    module_path: "../../../modules/nf-core/flye/main"
    output_channel: "fasta"
    parameters:
      - name: "modes"
        values: ["nano-hq", "nano-corr", "nano-raw"]
        description: "Flye assembly modes for different read types"

  # Example: Canu - another long-read assembler (disabled by default)
  canu:
    enabled: false
    module: "CANU"
    module_path: "../../../modules/nf-core/canu/main"
    output_channel: "assembly"
    parameters:
      - name: "genome_size"
        values: ["5m", "10m"]
        description: "Expected genome size for assembly"

  # Example: Miniasm - fast long-read assembler (disabled by default)
  miniasm:
    enabled: false
    module: "MINIASM"
    module_path: "../../../modules/nf-core/miniasm/main"
    output_channel: "fasta"
    parameters:
      - name: "preset"
        values: ["ava-ont", "ava-pb"]
        description: "Preset for different sequencing technologies"

  # Example: Raven - de novo genome assembler (disabled by default)
  raven:
    enabled: false
    module: "RAVEN"
    module_path: "../../../modules/nf-core/raven/main"
    output_channel: "fasta"
    parameters:
      - name: "polishing_rounds"
        values: [2, 4]
        description: "Number of polishing rounds"
