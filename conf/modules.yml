# QC Tools Configuration
# This file defines which quality control tools are available and which options you want to use in the benchmarking
# Tools can be enabled/disabled and configured without modifying the pipeline code

qc_tools:
  # Baseline tool - no filtering (always enabled)
  copyfastq:
    enabled: true
    type: "local"
    output_channel: "fastq"

  # Chopper - quality filtering for nanopore data
  chopper:
    enabled: true
    type: "nf-core"
    output_channel: "fastq"
    options:
      - option: "--quality"
        values: [13]
        additional_options: "-l 1000"
      - option: "--maxgc"
        values: [0.8]
        additional_options: "-l 1000"
    extra_inputs:
      fasta: []

  # PRINSEQ++ - multi-threaded quality control
  prinseqplusplus:
    enabled: true
    type: "nf-core"
    output_channel: "good_reads"
    options:
      - option: "-min_qual_mean"
        values: [15]
        additional_options: "-min_len 1000"

  # Example: NanoFilt - another quality filter (disabled by default)
  nanofilt:
    enabled: true
    type: "nf-core"
    output_channel: "filtreads"
    options:
      - option: "--quality"
        values: [13]
    extra_inputs:
      summary_file: []

  # Example: Filtlong - length-based filtering (disabled by default)
  filtlong:
    enabled: false
    type: "nf-core"
    output_channel: "reads"
    options:
      - option: "min_mean_q"
        values: [13, 15]
 
  # Example: Custom tool with direct values
  custom_tool:
    enabled: false
    type: "local"
    output_channel: "fastq"
    options:
      - option: "custom_param"
        values: [10, 20, 30]

assembler:
  flye:
    enabled: true
    type: "nf-core"
    output_channel: "fasta"
    options:
      - option: "-g"
        values: ["4.4m"]
    extra_inputs:
      mode: "--nano-corr"
